<!-- Busca Integrada ao Navbar -->
<div class="search-container">
  <div class="search-box">
    <i class="fas fa-search search-icon"></i>
    <input 
      type="text" 
      id="search-input" 
      class="search-input"
      placeholder="Buscar dia ou capítulo (ex: 'Dia 15' ou 'Gênesis 1')"
      aria-label="Buscar no plano de leitura"
    />
    <button id="search-clear" class="search-clear" title="Limpar busca">
      <i class="fas fa-times"></i>
    </button>
  </div>
  <div id="search-results" class="search-results hidden"></div>
</div>
