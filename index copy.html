<!DOCTYPE html>
<html lang="pt-BR" class="light-mode">
<head>
  <!-- =========================================================================
       index.html — Tela Principal (App de Leitura Bíblica)
       Versão: 0.1
       Aplicação: Leitura Cronológica Controlada da Bíblia
       Autor: Ruyter Torres

       ALTERAÇÃO (v0.1):
       -------------------------------------------------------------------------
       - Criação de estrutura base do aplicativo
       - Nenhuma lógica de negócio presente neste arquivo
       - Conteúdo renderizado exclusivamente via JavaScript
       - Preparado para uso em desktop e mobile (responsivo)
       - Arquitetura compatível com futura evolução para PWA
       ========================================================================= -->

  <!-- Metadados essenciais -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Plano de Leitura Bíblica Cronológica</title>

  <!-- CSS base (temporário — Tailwind será integrado posteriormente) -->

<body>

  <!-- =========================================================================
       NAVBAR
       -------------------------------------------------------------------------
       - Contém título do projeto
       - Futuramente poderá conter:
         • seletor de dias
         • progresso de leitura
         • alternância de tema (dark/light)
       ========================================================================= -->
  <nav id="navbar">
    <!-- Renderizado estaticamente ou via JS no futuro -->
  </nav>

  <!-- =========================================================================
       CONTEÚDO PRINCIPAL
       -------------------------------------------------------------------------

       ========================================================================= -->
  <main id="app">

    </section>

  <!-- =========================================================================
       FOOTER
       -------------------------------------------------------------------------
       - Informações institucionais
       - Versão do app
       - Créditos
       ========================================================================= -->

    <!-- Conteúdo simples ou dinâmico futuramente -->
