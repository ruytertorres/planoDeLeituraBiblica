<!doctype html>
<html lang="pt-BR" class="light-mode">
  <head>
    <!-- =========================================================================
       index.html — TEMPLATE PASSIVO DA APLICAÇÃO
       Versão: 0.8.0
       Aplicação: Leitura Bíblica Cronológica
    ========================================================================= -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Aplicação de Leitura Bíblica Cronológica e Estruturada"
    />

    <title>Plano de Leitura Bíblica Cronológica</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/notas.css" />

    <!-- Ícones -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body>
    <!-- =========================================================================
       NAVBAR
    ========================================================================= -->
    <nav id="navbar">
      <div class="navbar-container">
        <a href="#" class="navbar-title">
          <i class="fas fa-bible"></i>
          Leitura Bíblica Cronológica
        </a>

        <div class="navbar-stats">
          <div class="stat-item">
            <span class="stat-value" id="total-dias">—</span>
            <span class="stat-label">Dias</span>
          </div>

          <div class="stat-item">
            <span class="stat-value" id="dias-lidos">—</span>
            <span class="stat-label">Lidos</span>
          </div>

          <div class="stat-item">
            <span class="stat-value" id="progresso">—%</span>
            <span class="stat-label">Progresso</span>
          </div>

          <button class="theme-toggle" id="theme-toggle">
            <i class="fas fa-moon"></i>
          </button>
        </div>
      </div>
    </nav>

    <!-- =========================================================================
       CONTEÚDO PRINCIPAL
    ========================================================================= -->
    <main id="app">
      <header class="app-header">
        <h1>Plano Cronológico da Bíblia</h1>
        <p>
          Leia toda a Bíblia em 317 dias, seguindo uma ordem cronológica e
          temática.
        </p>
      </header>

      <!-- =========================================================================
         VISUALIZAÇÃO DO DIA ATUAL
      ========================================================================= -->
      <section id="dia-view" aria-live="polite">
        <!-- render_dia_card.js injeta aqui -->
      </section>

      <!-- =========================================================================
         NAVEGAÇÃO ENTRE DIAS
      ========================================================================= -->
      <nav id="dia-navegacao" class="dia-navegacao">
        <button id="btn-dia-anterior" class="btn btn-secondary">
          ◀ Dia anterior
        </button>

        <button
          id="btn-calendario"
          class="btn btn-tertiary"
          disabled
          title="Calendário (em breve)"
        >
          📅
        </button>

        <button id="btn-dia-proximo" class="btn btn-secondary">
          Próximo dia ▶
        </button>
      </nav>

      <!-- =========================================================================
         PLANO COMPLETO (LEGADO / BACKUP)
      ========================================================================= -->
      <section id="plano-leitura">
        <div class="loading-state">
          <i class="fas fa-spinner fa-spin fa-2x"></i>
          <p>Carregando plano de leitura...</p>
        </div>
      </section>
    </main>

    <!-- =========================================================================
       NOTAS FLUTUANTES
    ========================================================================= -->
    <section id="notasFlutuantes">
      <button id="btn-notas" title="Abrir/Fechar anotações">📝</button>

      <div id="notas-overlay" class="hidden">
        <div class="notas-container">
          <div class="notas-header">
            <div class="notas-title">
              <i class="fas fa-edit"></i>
              <span>Minhas Anotações</span>
            </div>

            <div class="notas-acoes">
              <button id="btn-exportar" class="notas-btn-icon">
                <i class="fas fa-download"></i>
              </button>
              <button id="btn-fechar" class="notas-btn-icon notas-btn-fechar">
                <i class="fas fa-times"></i>
              </button>
            </div>
          </div>

          <div class="notas-toolbar">
            <button data-nota-action="bold"></button>
            <button data-nota-action="italic"></button>
            <button data-nota-action="underline"></button>
          </div>

          <div id="notas-editor" contenteditable="true">
            <p></p>
          </div>

          <div class="notas-footer">
            <button id="btn-limpar" class="danger">🗑️ Limpar Tudo</button>
          </div>
        </div>
      </div>
    </section>

    <!-- =========================================================================
       FOOTER
    ========================================================================= -->
    <footer id="footer">
      <div class="footer-container">
        <div>
          <p>
            &copy; <span id="current-year">—</span>
            Leitura Bíblica Cronológica
          </p>
          <p class="app-version">Versão 0.8</p>
        </div>
      </div>
    </footer>

    <!-- ENTRY POINT -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
